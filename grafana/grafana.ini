[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
root_url = http://localhost:3000
serve_from_sub_path = false
app_title = Quantus Monitoring

[users]
# Align with quantus.com dark UI; users can still switch in profile
default_theme = dark

# Built-in Public Dashboards (shareable link; main Grafana stays login-only)
[public_dashboards]
enabled = true


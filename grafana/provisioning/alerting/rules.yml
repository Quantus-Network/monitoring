apiVersion: 1

# File provisioning only upserts listed rules. UIDs dropped from groups remain
# in existing Grafana databases unless listed here. Safe no-op if already gone.
deleteRules:
  - orgId: 1
    uid: task_master_down
  - orgId: 1
    uid: task_master_high_error_rate
  - orgId: 1
    uid: bootnode-node-down-alert
  - orgId: 1
    uid: bootnode-low-peer-count-alert
  - orgId: 1
    uid: bootnode-no-new-blocks-alert
  - orgId: 1
    uid: rpcnode-node-down-alert
  - orgId: 1
    uid: rpcnode-low-peer-count-alert

groups:
  # Node Health Monitoring
  - orgId: 1
    name: Node Health Alerts
    folder: Alerts
    interval: 1m
    rules:
      # Alert when node is down
      - uid: node-down-alert
        title: Node Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: up{job=~".*-(substrate|node|chain)"}
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          description: 'Node {{ index $labels "instance" }} (job: {{ index $labels "job" }}) is down for more than 5 minutes - check node status immediately'
          summary: 'Node {{ index $labels "instance" }} is DOWN'
        labels:
          severity: critical

      # Alert when peer count is low
      - uid: low-peer-count-alert
        title: Low Peer Count
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: substrate_sub_libp2p_peers_count{chain!="heisenberg"}
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params:
                      - 2
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          description: '{{ with $values.B }}Node {{ index $labels "instance" }} (chain: {{ index $labels "chain" }}) has {{ printf "%.0f" .Value }} peers (threshold: <2) - check network connectivity{{ else }}Node {{ index $labels "instance" }} (chain: {{ index $labels "chain" }}) peer count could not be measured - peer metrics returned no data{{ end }}'
          summary: 'Low peer count on {{ index $labels "instance" }}'
        labels:
          severity: warning
      # Alert when no new blocks for 7+ minutes (rule), notified after ~10 min
      # Total time-to-Telegram = 7 min (block age threshold) + 1 min (for:)
      #                       + ~2 min (group_wait in policies.yml) ≈ 10 min
      - uid: no-new-blocks-alert
        title: No New Blocks
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: (time() - (qpow_metrics{data_group="last_block_time"} / 1000)) / 60
              refId: A
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params:
                      - 7
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          description: '{{ with $values.B }}Chain {{ index $labels "chain" }} (instance: {{ index $labels "instance" }}) - last block was {{ printf "%.1f" .Value }} minutes ago (alert fires after ~10 min without a block) - check block production{{ else }}Chain {{ index $labels "chain" }} (instance: {{ index $labels "instance" }}) last block time could not be measured - block time metrics returned no data{{ end }}'
          summary: 'No new blocks on {{ index $labels "chain" }}'
        labels:
          severity: critical

      # RPC nodes are not validators and do not export last_block_time.
      # Equivalent signal: best block height has not increased for 7+ minutes.
      - uid: rpcnode-no-new-blocks-alert
        title: RPC Node No New Blocks
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: delta(substrate_block_height{status="best", job="rpcnode-chain"}[7m])
              refId: A
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          description: '{{ with $values.B }}RPC node {{ index $labels "instance" }} best block height has not increased in 7+ minutes (delta: {{ printf "%.0f" .Value }}) - node may be stalled or disconnected from block producers{{ else }}RPC node {{ index $labels "instance" }} best-block delta could not be measured - block height metrics returned no data{{ end }}'
          summary: 'No new blocks on RPC node {{ index $labels "instance" }}'
        labels:
          chain: staging_mainnet
          severity: critical

  # System Resource Monitoring
  - orgId: 1
    name: System Resource Alerts
    folder: Alerts
    interval: 2m
    rules:
      # Alert when CPU usage is high
      - uid: high-cpu-alert
        title: High CPU Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 15m
        annotations:
          description: '{{ with $values.B }}CPU usage on {{ index $labels "instance" }} has exceeded 80% (current: {{ printf "%.1f" .Value }}%) for more than 15 minutes{{ else }}CPU usage on {{ index $labels "instance" }} could not be measured - CPU metrics returned no data{{ end }}'
          summary: 'High CPU usage on {{ index $labels "instance" }}'
        labels:
          severity: warning

      # Alert when memory usage is high
      - uid: high-memory-alert
        title: High Memory Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params:
                      - 90
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          description: '{{ with $values.B }}Memory usage on {{ index $labels "instance" }} has exceeded 90% (current: {{ printf "%.1f" .Value }}%) for more than 10 minutes{{ else }}Memory usage on {{ index $labels "instance" }} could not be measured - memory metrics returned no data{{ end }}'
          summary: 'High memory usage on {{ index $labels "instance" }}'
        labels:
          severity: warning

      # Alert when disk space is low
      - uid: low-disk-space-alert
        title: Low Disk Space
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          description: '{{ with $values.B }}Disk space on {{ index $labels "instance" }} has exceeded 85% usage (current: {{ printf "%.1f" .Value }}%) - immediate action required{{ else }}Disk space on {{ index $labels "instance" }} could not be measured - filesystem metrics returned no data{{ end }}'
          summary: 'Low disk space on {{ index $labels "instance" }}'
        labels:
          severity: critical

  # Support Services Monitoring
  - orgId: 1
    name: Support Services Alerts
    folder: Alerts
    interval: 1m
    rules:
      # Alert when telemetry host is down
      - uid: telemetry-host-down-alert
        title: Telemetry Host Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: up{job="telemetry-host"}
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          description: 'Telemetry Host ({{ index $labels "instance" }}) is down for more than 5 minutes - telemetry monitoring unavailable'
          summary: "Telemetry Host is DOWN"
        labels:
          severity: critical

      # ===============================================
      # FAUCET MONITORING ALERTS (Planck - Highest Priority)
      # ===============================================
      - uid: faucet_downtime
        title: Faucet Service Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="support-faucet"}
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: avg
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          description: 'Faucet service ({{ index $labels "instance" }}) is not responding - users cannot request tokens'
          summary: "Faucet Service is DOWN"
        labels:
          chain: planck
          severity: critical

      - uid: faucet_high_failure_rate
        title: Faucet High Transfer Failure Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (rate(faucet_failed_transfers{job="support-faucet"}[5m]) / (rate(faucet_total_requests{job="support-faucet"}[5m]) + 0.001)) * 100
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: avg
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 75
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          description: '{{ with $values.B }}Faucet transfer failure rate is {{ printf "%.1f" .Value }}% (threshold: >75%) - check logs and chain connection{{ else }}Faucet transfer failure rate could not be measured - faucet metrics returned no data{{ end }}'
          summary: "High Transfer Failure Rate"
        labels:
          chain: planck
          severity: warning

      - uid: faucet_high_rejection_rate
        title: Faucet High Rejection Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (rate(faucet_rejected_requests{job="support-faucet"}[5m]) / (rate(faucet_total_requests{job="support-faucet"}[5m]) + 0.001)) * 100
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: avg
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 75
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          description: '{{ with $values.B }}Faucet rejection rate is {{ printf "%.1f" .Value }}% (threshold: >75%) - possible spam or validation issues{{ else }}Faucet rejection rate could not be measured - faucet metrics returned no data{{ end }}'
          summary: "High Request Rejection Rate"
        labels:
          chain: planck
          severity: warning

      # ===============================================
      # EXPLORER MONITORING ALERTS (Planck - Highest Priority)
      # ===============================================
      - uid: explorer_down
        title: Explorer Service Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="planck-subsquid-proc-1"}
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: avg
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 3m
        annotations:
          description: 'Explorer service ({{ index $labels "instance" }}) is not responding - blockchain data indexing unavailable'
          summary: "Explorer Service is DOWN"
        labels:
          chain: planck
          severity: critical

      - uid: explorer_sync_lag
        title: Explorer Sync Lag
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sqd_processor_chain_height{job="planck-subsquid-proc-1"} - sqd_processor_last_block{job="planck-subsquid-proc-1"}
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: avg
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 100
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 10m
        annotations:
          description: '{{ with $values.B }}Explorer is {{ printf "%.0f" .Value }} blocks behind chain height (threshold: >100 blocks) - check processing performance{{ else }}Explorer sync lag could not be measured - processor metrics returned no data{{ end }}'
          summary: "Explorer Synchronization Lag"
        labels:
          chain: planck
          severity: warning

      - uid: explorer_high_rpc_failure_rate
        title: Explorer High RPC Failure Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (rate(sqd_rpc_request_count{job="planck-subsquid-proc-1",kind="failure"}[5m]) / (rate(sqd_rpc_request_count{job="planck-subsquid-proc-1",kind="success"}[5m]) + rate(sqd_rpc_request_count{job="planck-subsquid-proc-1",kind="failure"}[5m]) + 0.001)) * 100
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: avg
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 10
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          description: '{{ with $values.B }}Explorer RPC failure rate is {{ printf "%.1f" .Value }}% (threshold: >10%) - check RPC node connectivity at {{ index $labels "url" }}{{ else }}Explorer RPC failure rate could not be measured - RPC metrics returned no data{{ end }}'
          summary: "High RPC Failure Rate"
        labels:
          chain: planck

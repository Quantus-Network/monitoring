apiVersion: 1

policies:
  - orgId: 1
    receiver: Email Notifications
    group_by: ["alertname", "grafana_folder", "instance"]
    group_wait: 30s
    group_interval: 5m
    # Effectively notify once until resolved; re-notify only after resolve → fire again
    repeat_interval: 8736h
    routes:
      # Planck — no email. Same matchers as production; mute-planck suppresses delivery.
      - receiver: Email Notifications
        matchers:
          - chain = planck
        mute_time_intervals:
          - mute-planck
        continue: false

      - receiver: Email Notifications
        matchers:
          - job =~ "planck-.*"
        mute_time_intervals:
          - mute-planck
        continue: false

      - receiver: Email Notifications
        matchers:
          - instance =~ ".*planck.*"
        mute_time_intervals:
          - mute-planck
        continue: false

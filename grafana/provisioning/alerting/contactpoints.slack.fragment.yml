  - orgId: 1
    name: Slack Notifications
    receivers:
      - uid: slack-contact-point
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_URL}
          username: Grafana Monitor
          title: |
            {{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} {{ .CommonLabels.alertname }} — {{ .Status | toUpper }}
          text: |
            {{ range .Alerts -}}
            {{- if .Labels.severity }}*Severity:* {{ .Labels.severity }}
            {{ end -}}
            {{- if .Labels.chain }}*Chain:* {{ .Labels.chain }}
            {{ end -}}
            {{- if .Labels.instance }}*Instance:* {{ .Labels.instance }}
            {{ end -}}
            {{- if .Annotations.summary }}
            📋 {{ .Annotations.summary }}
            {{ end -}}
            {{- if .Annotations.description }}
            {{ .Annotations.description }}
            {{ end -}}
            {{- if .GeneratorURL }}
            🔗 <{{ .GeneratorURL }}|View in Grafana>{{ if .SilenceURL }} · <{{ .SilenceURL }}|Silence>{{ end }}
            {{- else if .SilenceURL }}
            🔗 <{{ .SilenceURL }}|Silence>
            {{- end }}

            {{ end -}}
          color: '{{ if eq .Status "firing" }}#D63232{{ else }}#36a64f{{ end }}'
        disableResolveMessage: false
